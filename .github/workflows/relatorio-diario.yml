name: Relatório diário

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relatorio-diario
  cancel-in-progress: false

jobs:
  relatorio:
    name: Gerar e publicar relatório
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest -q -p no:logging > resultado-testes.txt 2>&1 || true

      - name: Gerar relatório
        run: python -m scripts.relatorio_diario

      - name: Publicar no repositório
        env:
          AUTOR_NOME: ${{ vars.GIT_AUTOR_NOME }}
          AUTOR_EMAIL: ${{ vars.GIT_AUTOR_EMAIL }}
        run: |
          git config user.name "${AUTOR_NOME:-github-actions[bot]}"
          git config user.email "${AUTOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add docs/relatorio-diario.md
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -m "Relatório diário de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git pull --rebase origin main
          git push origin HEAD:main
