name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 11 * * *"  # todo dia às 08:47 (Brasília)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e formatação
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  testes:
    name: Testes (${{ matrix.banco }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        banco: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: estoque_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teste"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.banco == 'postgres' && 'postgresql://teste:teste@localhost:5432/estoque_teste' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Migrações do zero até a última e de volta
        if: matrix.banco == 'postgres'
        env:
          DATABASE_URL: postgresql://teste:teste@localhost:5432/estoque_teste
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Dados de demonstração
        if: matrix.banco == 'sqlite'
        env:
          DATABASE_URL: sqlite:///./dados/ci.db
          SENHA_DEMO: senha-de-ci-123
        run: python -m scripts.popular_banco --pedidos 150 --meses 2

  docker:
    name: Imagem Docker
    runs-on: ubuntu-24.04
    needs: [qualidade]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sistema-pedidos-estoque:ci .
